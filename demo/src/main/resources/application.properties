spring.application.name=eams-backend

# Optional local env file import (key=value format)
spring.config.import=optional:file:.env[.properties]

# Data source
spring.datasource.url=jdbc:postgresql://localhost:5432/eams_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# Elasticsearch
spring.elasticsearch.uris=${ELASTICSEARCH_URI:http://localhost:9200}

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Server
server.port=8081

# JWT
jwt.secret=${JWT_SECRET:eams-super-secret-key-change-in-production-min-256-bits}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# E-AMS
eams.mail.from-address=${MAIL_USERNAME:}
eams.mail.from-name=E-AMS Platform
eams.magic-link.expiry-minutes=15
eams.magic-link.base-url=${FRONTEND_URL:http://localhost:5173}
eams.ai.anthropic-api-key=${ANTHROPIC_API_KEY:}
eams.ai.model=claude-sonnet-4-20250514

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info
