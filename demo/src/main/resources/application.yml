spring:
  application:
    name: eams-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/eams_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:eams-super-secret-key-change-in-production-min-256-bits}
  expiration: 900000
  refresh-expiration: 604800000

eams:
  mail:
    from-address: ${MAIL_USERNAME:}
    from-name: "E-AMS Platform"
  magic-link:
    expiry-minutes: 15
    base-url: ${FRONTEND_URL:http://localhost:5173}
  ai:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: claude-sonnet-4-20250514

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info