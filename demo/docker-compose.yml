version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: eams-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:123}
      POSTGRES_DB: eams_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eams-network

  redis:
    image: redis:7-alpine
    container_name: eams-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - eams-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: eams-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eams-network

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: eams-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - eams-network

  minio:
    image: minio/minio
    container_name: eams-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - eams-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eams-backend
    ports:
      - "8081:8081"
    environment:
      - DB_USERNAME=postgres
      - DB_PASSWORD=123
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - ELASTICSEARCH_URI=http://elasticsearch:9200
      - JWT_SECRET=${JWT_SECRET:replace-with-a-long-random-256-bit-secret}
      - MAIL_HOST=${MAIL_HOST:smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:587}
      - MAIL_USERNAME=${MAIL_USERNAME:}
      - MAIL_PASSWORD=${MAIL_PASSWORD:}
      - FRONTEND_URL=${FRONTEND_URL:http://localhost:5173}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - eams-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:
  minio_data:

networks:
  eams-network:
    driver: bridge